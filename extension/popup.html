<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { font: 13px -apple-system, system-ui, sans-serif; width: 380px; margin: 12px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .err { background: #fdecea; color: #b71c1c; padding: 10px; border-radius: 6px; }
  .ok { color: #2e7d32; }
  .muted { color: #777; font-size: 12px; }
  label { display: block; margin-top: 8px; font-weight: 600; }
  input, select { width: 100%; box-sizing: border-box; padding: 5px; margin-top: 3px; font-size: 12px; }
  button { margin-top: 10px; width: 100%; padding: 8px; font-size: 14px; cursor: pointer;
           background: #1565c0; color: #fff; border: 0; border-radius: 6px; }
  button:disabled { background: #999; cursor: default; }
  #msg { margin-top: 8px; }
</style></head>
<body>
  <h1>VideoGrabber</h1>
  <div id="app" class="muted">Проверка…</div>
  <div id="main" hidden>
    <label>Название файла</label>
    <input id="title">
    <label>Видео (m3u8)</label>
    <select id="urls"></select>
    <button id="go">Скачать</button>
  </div>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body></html>
